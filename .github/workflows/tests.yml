name: Test CLI and notebooks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the Conda environment
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          environment-file: environment.yml
          activate-environment: ouroboros
          channels: conda-forge
          channel-priority: strict
      - name: Run CLI tests
        run: python -m unittest discover -s tests -v
      - name: Execute Jupyter notebooks
        run: jupyter nbconvert --to notebook --execute --output-dir build/executed notebooks/*.ipynb
